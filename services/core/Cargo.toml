[package]
name = "fiscal-core"
version = "0.1.0"
edition = "2021"
description = "Bank-grade Rust core: EventStore + TigerBeetle + DGII e-CF + Payroll Advance"
default-run = "fiscal-core"

[dependencies]
# Async + Web - axum 0.6 (pinned; was chosen to match tonic's http 0.2, tonic is gone now but left as-is for this pass)
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.6", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace"] }
http = "0.2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls","postgres","uuid","json","chrono","rust_decimal"] }
uuid = { version = "1.10", features = ["v4","serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Money
rust_decimal = { version = "1.35", features = ["serde-with-str"] }
rust_decimal_macros = "1.35"

# Crypto - DGII signing + Auth
openssl = { version = "0.10", features = ["vendored"] }
sha2 = "0.10"
base64 = { version = "0.22" }
zeroize = "1.8"
roxmltree = "0.20"
argon2 = "0.5"
jsonwebtoken = { version = "9", features = ["use_pem"] }
rand = "0.8"

# HTTP client for DGII real send
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
mime = "0.3"

# bin/import_rnc: descarga y descomprime el padron DGII_RNC.zip de DGII
zip = "2"

# Utils
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "2.0"

[[bin]]
name = "fiscal-core"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "import_rnc"
path = "src/bin/import_rnc.rs"
